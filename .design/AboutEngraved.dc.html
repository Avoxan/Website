<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=JetBrains+Mono:wght@400;500&family=Geist:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; background: #F4EEE1; }
    a { color: #D2521C; } a:hover { color: #BF471A; }
    .disp { font-family: Fraunces, Georgia, serif; font-variation-settings: 'opsz' 144, 'SOFT' 20; }
    .body { font-family: Geist, -apple-system, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .eg { position: relative; cursor: pointer; overflow: hidden; background: #ECE4D4; border: 1px solid rgba(28,24,19,0.13); }
    .lines, .photo { position: absolute; inset: 0; transition: opacity 700ms cubic-bezier(0.22,1,0.36,1); }
    .photo { opacity: 0; }
    .eg:hover .lines, .eg:active .lines { opacity: 0; }
    .eg:hover .photo, .eg:active .photo { opacity: 1; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; background: #F4EEE1; color: #1C1813; box-sizing: border-box; padding: 62px 64px; position: relative;">

  <div class="mono" style="font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.22em; color: #D2521C; display: flex; align-items: center; gap: 12px;">
    <span style="width: 5px; height: 5px; background: #D2521C; border-radius: 50%;"></span>
    Direction B · engraved
  </div>

  <h2 class="disp" style="margin: 26px 0 0; font-size: 60px; line-height: 1.04; letter-spacing: -0.02em; font-weight: 420; max-width: 20ch;">
    We take the work seriously.<br>
    <em style="font-style: italic; font-weight: 380; font-variation-settings: 'opsz' 144, 'SOFT' 80; color: #6E6456;">Ourselves, less so.</em>
  </h2>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; margin-top: 52px;">

    <div class="eg" style="height: 420px;">
      <div class="lines">
        <svg viewBox="0 0 600 420" width="100%" height="100%" preserveAspectRatio="xMidYMax slice">
          <defs>
            <pattern id="h1" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 6 L6 0" stroke="#1C1813" stroke-width="1.1" opacity="0.62"/></pattern>
            <pattern id="h2" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 4 L4 0" stroke="#1C1813" stroke-width="1" opacity="0.32"/></pattern>
          </defs>
          <ellipse cx="300" cy="182" rx="84" ry="102" fill="url(%23h2)"/>
          <path d="M300 292 C 212 292 158 342 144 420 L 456 420 C 442 342 388 292 300 292 Z" fill="url(%23h1)"/>
          <ellipse cx="300" cy="182" rx="84" ry="102" fill="none" stroke="#1C1813" stroke-width="1.4"/>
          <path d="M264 208 q 36 9 72 0" stroke="#1C1813" stroke-width="3.4" fill="none" stroke-linecap="round"/>
          <path d="M252 150 q 22 -12 44 -2 M304 148 q 22 -10 44 2" stroke="#1C1813" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="photo" style="background: linear-gradient(155deg, #E8C9A8 0%, #C9906A 55%, #8A5A38 100%);">
        <svg viewBox="0 0 600 420" width="100%" height="100%" preserveAspectRatio="xMidYMax slice">
          <defs><linearGradient id="p1" x1="0" y1="0" x2="1" y2="0.4"><stop offset="0" stop-color="#F6E0C8"/><stop offset="0.6" stop-color="#C08A5E"/><stop offset="1" stop-color="#6B432A"/></linearGradient></defs>
          <ellipse cx="300" cy="182" rx="84" ry="102" fill="url(%23p1)"/>
          <path d="M300 292 C 212 292 158 342 144 420 L 456 420 C 442 342 388 292 300 292 Z" fill="url(%23p1)"/>
          <path d="M262 204 q 38 28 76 0" stroke="#4A2C1A" stroke-width="4" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div style="position: absolute; left: 26px; bottom: 22px;">
        <div class="disp" style="font-size: 44px; line-height: 0.96; letter-spacing: -0.028em; font-weight: 440; color: #1C1813;">[FIRST]<br>[LAST]</div>
      </div>
    </div>

    <div class="eg" style="height: 420px;">
      <div class="lines">
        <svg viewBox="0 0 600 420" width="100%" height="100%" preserveAspectRatio="xMidYMax slice">
          <defs>
            <pattern id="h3" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M6 6 L0 0" stroke="#1C1813" stroke-width="1.1" opacity="0.62"/></pattern>
            <pattern id="h4" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M4 4 L0 0" stroke="#1C1813" stroke-width="1" opacity="0.32"/></pattern>
          </defs>
          <ellipse cx="300" cy="182" rx="84" ry="102" fill="url(%23h4)"/>
          <path d="M300 292 C 212 292 158 342 144 420 L 456 420 C 442 342 388 292 300 292 Z" fill="url(%23h3)"/>
          <ellipse cx="300" cy="182" rx="84" ry="102" fill="none" stroke="#1C1813" stroke-width="1.4"/>
          <path d="M264 208 q 36 9 72 0" stroke="#1C1813" stroke-width="3.4" fill="none" stroke-linecap="round"/>
          <path d="M252 150 q 22 -12 44 -2 M304 148 q 22 -10 44 2" stroke="#1C1813" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="photo" style="background: linear-gradient(205deg, #E8C9A8 0%, #C9906A 55%, #8A5A38 100%);">
        <svg viewBox="0 0 600 420" width="100%" height="100%" preserveAspectRatio="xMidYMax slice">
          <defs><linearGradient id="p2" x1="1" y1="0" x2="0" y2="0.4"><stop offset="0" stop-color="#F6E0C8"/><stop offset="0.6" stop-color="#C08A5E"/><stop offset="1" stop-color="#6B432A"/></linearGradient></defs>
          <ellipse cx="300" cy="182" rx="84" ry="102" fill="url(%23p2)"/>
          <path d="M300 292 C 212 292 158 342 144 420 L 456 420 C 442 342 388 292 300 292 Z" fill="url(%23p2)"/>
          <path d="M262 204 q 38 28 76 0" stroke="#4A2C1A" stroke-width="4" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div style="position: absolute; left: 26px; bottom: 22px;">
        <div class="disp" style="font-size: 44px; line-height: 0.96; letter-spacing: -0.028em; font-weight: 440; color: #1C1813;">[FIRST]<br>[LAST]</div>
      </div>
    </div>

  </div>

  <div class="mono" style="position: absolute; left: 64px; bottom: 30px; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #A4977F;">
    [ placeholder ] engraving redraws into photograph on hover · light mode
  </div>

</div>
</x-dc>
</body>
</html>
