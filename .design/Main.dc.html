<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,100..900&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #0A0A0A; }
    a { color: #E85D26; } a:hover { color: #FF7A3D; }
    .a { font-family: Archivo, 'Helvetica Neue', Arial, sans-serif; }
    .m { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .rail { position: absolute; top: 120px; bottom: 120px; width: 1px; background: #2A2A28; }
    .tick { position: absolute; left: -5px; width: 11px; height: 1px; background: #4A4A46; }
    .rlab { position: absolute; font-size: 9px; letter-spacing: 0.2em; color: #5C5C56; white-space: nowrap; }
    @keyframes breathe { 0%,100% { font-variation-settings: 'wght' 830, 'wdth' 100; } 50% { font-variation-settings: 'wght' 880, 'wdth' 103; } }
    @keyframes sweep  { 0% { transform: translateY(0); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateY(640px); opacity: 0; } }
    .word { animation: breathe 7s ease-in-out infinite; }
    .scan { position: absolute; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(232,93,38,0.55), transparent); animation: sweep 9s linear infinite; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; background: #0A0A0A; color: #F0EBE3; position: relative; overflow: hidden;">

  <div class="scan" style="top: 130px;"></div>

  <div class="rail" style="left: 70px;">
    <div class="tick" style="top: 0;"></div>       <div class="m rlab" style="top: -5px; left: 20px;">18:47</div>
    <div class="tick" style="top: 150px;"></div>   <div class="m rlab" style="top: 145px; left: 20px; color: #E85D26;">19:02</div>
    <div class="tick" style="top: 340px;"></div>   <div class="m rlab" style="top: 335px; left: 20px;">21:30</div>
    <div class="tick" style="top: 520px;"></div>   <div class="m rlab" style="top: 515px; left: 20px;">02:14</div>
    <div class="m rlab" style="bottom: -4px; left: 20px; color: #3A3A36;">CALLS · TUESDAY</div>
  </div>

  <div class="rail" style="right: 70px;">
    <div class="tick" style="top: 0; left: -5px;"></div>    <div class="m rlab" style="top: -5px; right: 20px; color: #E85D26;">01 SILENCE</div>
    <div class="tick" style="top: 130px;"></div>            <div class="m rlab" style="top: 125px; right: 20px;">02 COST</div>
    <div class="tick" style="top: 260px;"></div>            <div class="m rlab" style="top: 255px; right: 20px;">03 WORK</div>
    <div class="tick" style="top: 390px;"></div>            <div class="m rlab" style="top: 385px; right: 20px;">04 TERMS</div>
    <div class="tick" style="top: 520px;"></div>            <div class="m rlab" style="top: 515px; right: 20px;">05 PROOF</div>
    <div class="tick" style="top: 650px;"></div>            <div class="m rlab" style="top: 645px; right: 20px;">06 BOOK</div>
  </div>

  <div class="m" style="position: absolute; left: 0; right: 0; top: 46px; text-align: center; font-size: 11px; letter-spacing: 0.34em; text-transform: uppercase;">Avoxan</div>

  <div class="m" style="position: absolute; left: 160px; top: 300px; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #6E6E68;">Websites that</div>

  <div class="a word" style="position: absolute; left: 140px; right: 140px; top: 330px; font-size: 268px; line-height: 0.82; letter-spacing: -0.055em; font-weight: 850; text-align: center;">QUIETLY</div>

  <div class="m" style="position: absolute; left: 0; right: 0; top: 590px; text-align: center; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #6E6E68;">do the selling for you</div>

  <div style="position: absolute; left: 0; right: 0; bottom: 96px; text-align: center;">
    <div class="m" style="font-size: 11px; letter-spacing: 0.2em; color: #4A4A46;">SCROLL</div>
    <div style="width: 1px; height: 46px; background: linear-gradient(#4A4A46, transparent); margin: 14px auto 0;"></div>
  </div>

</div>
</x-dc>
</body>
</html>
