<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=JetBrains+Mono:wght@400;500&family=Geist:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; background: #0C0A08; }
    a { color: #E85D26; } a:hover { color: #FF7A3D; }
    .disp { font-family: Fraunces, Georgia, serif; font-variation-settings: 'opsz' 144, 'SOFT' 30; }
    .body { font-family: Geist, -apple-system, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

    .pf { position: relative; overflow: hidden; border: 1px solid rgba(242,235,220,0.10); cursor: pointer; }
    .layer { position: absolute; inset: 0; transition: opacity 620ms cubic-bezier(0.22,1,0.36,1); }
    .warm { opacity: 0; }
    .pf:hover .cold, .pf:active .cold { opacity: 0; }
    .pf:hover .warm, .pf:active .warm { opacity: 1; }
    .nm { transition: color 620ms cubic-bezier(0.22,1,0.36,1); }
    .pf:hover .nm, .pf:active .nm { color: #E85D26; }
    .role { transition: opacity 620ms ease; }
    .pf:hover .role, .pf:active .role { opacity: 1; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; background: #0C0A08; color: #F2EBDC; position: relative; overflow: hidden; box-sizing: border-box; padding: 62px 64px;">

  <div style="position: absolute; inset: 0; background-image: url('data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'160\' height=\'160\'><filter id=\'n\'><feTurbulence type=\'fractalNoise\' baseFrequency=\'0.8\' numOctaves=\'3\'/></filter><rect width=\'160\' height=\'160\' filter=\'url(%23n)\' opacity=\'0.5\'/></svg>'); opacity: 0.05; pointer-events: none; z-index: 9;"></div>

  <div class="mono" style="font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.22em; color: #E85D26; display: flex; align-items: center; gap: 12px;">
    <span style="width: 5px; height: 5px; background: #E85D26; border-radius: 50%;"></span>
    Two people. One studio.
  </div>

  <h2 class="disp" style="margin: 26px 0 0; font-size: 60px; line-height: 1.04; letter-spacing: -0.02em; font-weight: 420; max-width: 20ch;">
    We take the work seriously.<br>
    <em style="font-style: italic; font-weight: 380; font-variation-settings: 'opsz' 144, 'SOFT' 80; color: #968C7B;">Ourselves, less so.</em>
  </h2>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; margin-top: 52px;">

    <div class="pf" style="height: 430px; background: #14110E;">
      <div class="layer cold" style="background: linear-gradient(145deg, #2A2724 0%, #161412 60%, #0E0C0A 100%);">
        <svg viewBox="0 0 600 430" width="100%" height="100%" preserveAspectRatio="xMidYMax slice">
          <defs><linearGradient id="c1" x1="0" y1="0" x2="1" y2="0.4"><stop offset="0" stop-color="#8E8A85"/><stop offset="0.55" stop-color="#4A4643"/><stop offset="1" stop-color="#1C1A18"/></linearGradient></defs>
          <ellipse cx="300" cy="188" rx="86" ry="104" fill="url(#c1)"/>
          <path d="M300 300 C 210 300 156 350 142 430 L 458 430 C 444 350 390 300 300 300 Z" fill="url(#c1)"/>
          <path d="M262 214 q 38 10 76 0" stroke="#15130F" stroke-width="5" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="layer warm" style="background: linear-gradient(145deg, #4A2A17 0%, #2A1A11 58%, #14100C 100%);">
        <svg viewBox="0 0 600 430" width="100%" height="100%" preserveAspectRatio="xMidYMax slice">
          <defs><linearGradient id="w1" x1="0" y1="0" x2="1" y2="0.4"><stop offset="0" stop-color="#E8A87C"/><stop offset="0.55" stop-color="#9C5A33"/><stop offset="1" stop-color="#3A2117"/></linearGradient></defs>
          <ellipse cx="300" cy="188" rx="86" ry="104" fill="url(#w1)"/>
          <path d="M300 300 C 210 300 156 350 142 430 L 458 430 C 444 350 390 300 300 300 Z" fill="url(#w1)"/>
          <path d="M260 210 q 40 30 80 0" stroke="#2A1610" stroke-width="5" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 160px; background: linear-gradient(to top, rgba(12,10,8,0.92), transparent);"></div>
      <div style="position: absolute; left: 28px; right: 28px; bottom: 24px;">
        <div class="disp nm" style="font-size: 52px; line-height: 0.94; letter-spacing: -0.03em; font-weight: 440; color: #F2EBDC;">[FIRST]<br>[LAST]</div>
        <div class="mono role" style="margin-top: 12px; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #968C7B; opacity: 0.6;">Design &amp; build · Houston</div>
      </div>
    </div>

    <div class="pf" style="height: 430px; background: #14110E;">
      <div class="layer cold" style="background: linear-gradient(200deg, #2A2724 0%, #161412 60%, #0E0C0A 100%);">
        <svg viewBox="0 0 600 430" width="100%" height="100%" preserveAspectRatio="xMidYMax slice">
          <defs><linearGradient id="c2" x1="1" y1="0" x2="0" y2="0.4"><stop offset="0" stop-color="#8E8A85"/><stop offset="0.55" stop-color="#4A4643"/><stop offset="1" stop-color="#1C1A18"/></linearGradient></defs>
          <ellipse cx="300" cy="188" rx="86" ry="104" fill="url(#c2)"/>
          <path d="M300 300 C 210 300 156 350 142 430 L 458 430 C 444 350 390 300 300 300 Z" fill="url(#c2)"/>
          <path d="M262 214 q 38 10 76 0" stroke="#15130F" stroke-width="5" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="layer warm" style="background: linear-gradient(200deg, #4A2A17 0%, #2A1A11 58%, #14100C 100%);">
        <svg viewBox="0 0 600 430" width="100%" height="100%" preserveAspectRatio="xMidYMax slice">
          <defs><linearGradient id="w2" x1="1" y1="0" x2="0" y2="0.4"><stop offset="0" stop-color="#E8A87C"/><stop offset="0.55" stop-color="#9C5A33"/><stop offset="1" stop-color="#3A2117"/></linearGradient></defs>
          <ellipse cx="300" cy="188" rx="86" ry="104" fill="url(#w2)"/>
          <path d="M300 300 C 210 300 156 350 142 430 L 458 430 C 444 350 390 300 300 300 Z" fill="url(#w2)"/>
          <path d="M260 210 q 40 30 80 0" stroke="#2A1610" stroke-width="5" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 160px; background: linear-gradient(to top, rgba(12,10,8,0.92), transparent);"></div>
      <div style="position: absolute; left: 28px; right: 28px; bottom: 24px;">
        <div class="disp nm" style="font-size: 52px; line-height: 0.94; letter-spacing: -0.03em; font-weight: 440; color: #F2EBDC;">[FIRST]<br>[LAST]</div>
        <div class="mono role" style="margin-top: 12px; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #968C7B; opacity: 0.6;">Strategy &amp; client work · Houston</div>
      </div>
    </div>

  </div>

  <div class="mono" style="position: absolute; left: 64px; bottom: 30px; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #5E5648;">
    [ placeholder portraits — hover or press one ] · real photography mid-October
  </div>

</div>
</x-dc>
</body>
</html>
